<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuvora Kundli — Ganesha cover</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 210mm; height: 297mm; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #3b1830; background: #fbf3df; }
  main { position: relative; width: 210mm; height: 297mm; padding: 13mm 16mm 12mm; text-align: center; overflow: hidden; border: 3mm solid #7f2436; }
  main:before { content: ""; position: absolute; inset: 3mm; border: .45mm solid #c99b4b; pointer-events: none; }
  .brand { margin-top: 2mm; color: #7f2436; font-size: 13pt; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
  .subtitle { margin-top: 1.5mm; color: #8a653b; font-size: 8pt; letter-spacing: .16em; text-transform: uppercase; }
  img { display: block; width: 142mm; height: 178mm; margin: 4mm auto 0; object-fit: cover; object-position: center 22%; border: .5mm solid #c99b4b; border-radius: 4mm; }
  h1 { margin: 5mm 0 1mm; color: #7f2436; font-family: "Nirmala UI", "Mangal", sans-serif; font-size: 25pt; font-weight: 600; line-height: 1.35; }
  .translit { margin: 0; color: #8a4b32; font-size: 13pt; font-style: italic; letter-spacing: .035em; }
  .meaning { margin: 2mm 0 0; color: #6f543c; font-size: 9pt; }
  .footer { position: absolute; left: 16mm; right: 16mm; bottom: 8mm; padding-top: 3mm; border-top: .3mm solid #d5b67a; color: #7f2436; font-size: 9pt; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <div class="brand">Nuvora Jyotish</div>
  <div class="subtitle">Vedic Kundli · Sidereal Lahiri</div>
  <img src="static/ganesha-cover.png" alt="Lord Ganesha">
  <h1 lang="hi">ॐ गं गणपतये नमः</h1>
  <p class="translit">Om Gam Ganapataye Namaha</p>
  <p class="meaning">Salutations to Lord Ganesha</p>
  <div class="footer">May your path begin with clarity and wisdom</div>
</main>
</body>
</html>
